[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagelight"
version = "0.1.0"
description = "Ask your PDFs anything, completely offline. A PDF reader with a local LLM chat that cites pages."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
keywords = ["pdf", "llm", "offline", "local", "rag", "ollama", "llama", "reader"]
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.24"]

[project.urls]
Homepage = "https://github.com/ag-piyush/pagelight"
Issues = "https://github.com/ag-piyush/pagelight/issues"

[project.optional-dependencies]
fast = ["numpy"]

[project.scripts]
pagelight = "pagelight.cli:main"

[tool.setuptools]
packages = ["pagelight"]
include-package-data = true

[tool.setuptools.package-data]
pagelight = ["static/*", "static/**/*"]
