# Publishes pagelight to PyPI when a GitHub release is published.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check the release tag matches the package version
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          toml = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__\s*=\s*"([^"]+)"', open("pagelight/__init__.py").read()).group(1)
          if not (tag == toml == init):
              sys.exit(f"Version mismatch: tag {tag}, pyproject.toml {toml}, __init__.py {init}")
          print(f"Publishing {tag}")
          PY

      - name: Run tests
        run: |
          python3 -m pip install . pytest
          python3 -m pytest -q

      - name: Build
        run: |
          python3 -m pip install build twine
          python3 -m build
          python3 -m twine check --strict dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pagelight
    permissions:
      id-token: write   # lets PyPI verify this workflow; no token needed
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1